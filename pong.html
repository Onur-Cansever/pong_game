<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pong</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; background:#0a0a12; color:#fff;
    font-family:'Courier New',monospace; overflow:hidden; }
  body{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; }
  h1{ font-size:24px; letter-spacing:10px; color:#7df; text-shadow:0 0 12px #0ff; }
  canvas{ background:#05050c; border:2px solid #1e2a44; border-radius:8px;
    box-shadow:0 0 40px rgba(0,255,255,.15) inset, 0 0 25px rgba(0,0,0,.6);
    display:block; touch-action:none; max-width:96vw; }
  .hint{ font-size:13px; color:#5a6b8c; letter-spacing:1px; text-align:center; line-height:1.7; }
  .hint b{ color:#9fd; }
  .stat{ font-size:12px; color:#6b7f9e; display:flex; gap:16px; align-items:center; flex-wrap:wrap; justify-content:center; }
  .stat b{ color:#4fe3ff; }
  .skillbar{ display:inline-block; width:110px; height:8px; background:#1a2338;
    border-radius:4px; vertical-align:middle; overflow:hidden; }
  .skillbar i{ display:block; height:100%; width:0%; background:linear-gradient(90deg,#4fe3ff,#ff5d7d); transition:width .3s; }
  .dot{ display:inline-block; width:8px; height:8px; border-radius:50%; vertical-align:middle; margin-right:4px; }
  .dot.on{ background:#5dffb0; box-shadow:0 0 6px #5dffb0; }
  .dot.off{ background:#ff5d7d; box-shadow:0 0 6px #ff5d7d; }
  button{ background:#1a2338; color:#9fd; border:1px solid #2a3a5a; border-radius:6px;
    font-family:inherit; font-size:12px; padding:4px 10px; cursor:pointer; letter-spacing:1px; }
  button:hover{ background:#243350; }
  .diffs{ display:inline-flex; gap:5px; }
  .diff.active{ background:#2a4a6a; color:#fff; border-color:#4fe3ff;
    box-shadow:0 0 8px rgba(79,227,255,.4); }
</style>
</head>
<body>
  <h1>PONG</h1>
  <canvas id="game" width="800" height="500"></canvas>
  <div class="hint">Hareket: <b>↑ ↓</b> veya <b>W S</b> (veya fare) · Başlat: <b>SPACE</b> · Yeniden: <b>R</b> · Mod: <b>1 2 3 4</b> · Hafızayı sil: <b>L</b></div>
  <div class="stat">
    <span class="diffs">
      <button data-diff="easy"   class="diff">KOLAY</button>
      <button data-diff="normal" class="diff">ORTA</button>
      <button data-diff="hard"   class="diff">ZOR</button>
      <button data-diff="very_hard" class="diff">ÇOK ZOR</button>
    </span>
    <span><span class="dot off" id="brainDot"></span><b id="brainTxt">beyin çevrimdışı</b></span>
    <span>Rakip becerisi: <span class="skillbar"><i id="skillFill"></i></span> <b id="skillBox">0</b>/100</span>
    <span>Zayıf bölge: <b id="zoneBox">0/10</b></span>
    <button id="sndBtn">SES: AÇIK</button>
    <button id="memBtn">HAFIZAYI SIFIRLA</button>
  </div>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

const WIN_SCORE = 7;
const PAD_W = 12, PAD_H = 90, PAD_SPEED = 8;
const BALL_R = 8, BALL_SPEED0 = 6, BALL_ACC = 1.3, BALL_MAX = 17;
const ZONES = 10, ZH = H / ZONES;

let state = 'ready';
let scoreP = 0, scoreA = 0;
let winner = '';
let pauseUntil = 0, serveDir = 1;
let missedFlag = false;

/* Zorluk modu (beyin baştan hazır zekâ ile gelir + canlı gelişir) */
const DIFFS = {
  easy:{label:'KOLAY', key:'1'}, normal:{label:'ORTA', key:'2'},
  hard:{label:'ZOR', key:'3'}, very_hard:{label:'ÇOK ZOR', key:'4'},
};
let diff = localStorage.getItem('pong_diff') || 'normal';
if (!DIFFS[diff]) diff = 'normal';

const player = { x:24, y:H/2-PAD_H/2, w:PAD_W, h:PAD_H };
const ai     = { x:W-24-PAD_W, y:H/2-PAD_H/2, w:PAD_W, h:PAD_H };
const ball = { x:W/2, y:H/2, vx:0, vy:0, speed:BALL_SPEED0, prevX:W/2 };

const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const lerp  = (a,b,t) => a + (b - a) * t;

/* ================= SES (WebAudio sentez — dosya yok) ================= */
let AC = null, master = null;
let soundOn = localStorage.getItem('pong_sound') !== 'off';
const sndBtn = document.getElementById('sndBtn');
function updateSndBtn(){ sndBtn.textContent = 'SES: ' + (soundOn ? 'AÇIK' : 'KAPALI'); }
function audio(){
  if (!AC) {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = 0.5; master.connect(AC.destination);
  }
  if (AC.state === 'suspended') AC.resume();
  return AC;
}
function blip(freq, dur, type, vol, slideTo){
  if (!soundOn) return;
  try {
    const ac = audio();
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = freq;
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, ac.currentTime + dur);
    g.gain.setValueAtTime(vol, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur);
    o.connect(g); g.connect(master);
    o.start(); o.stop(ac.currentTime + dur + 0.02);
  } catch(e){}
}
const S = {
  hitPlayer: () => blip(520, 0.09, 'square', 0.5, 700),
  hitAi:     () => blip(300, 0.11, 'square', 0.45, 240),
  wall:      () => blip(200, 0.05, 'triangle', 0.3, 160),
  serve:     () => blip(360, 0.06, 'triangle', 0.25, 430),
  score:     () => { blip(520,0.10,'sawtooth',0.35,760); setTimeout(()=>blip(780,0.12,'sawtooth',0.3,1040),80); },
  lost:      () => { blip(300,0.16,'sawtooth',0.35,200); setTimeout(()=>blip(200,0.2,'sawtooth',0.3,120),110); },
  win:  () => { [523,659,784,1047].forEach((f,i)=>setTimeout(()=>blip(f,0.18,'square',0.4),i*110)); },
  lose: () => { [400,330,270,170].forEach((f,i)=>setTimeout(()=>blip(f,0.24,'sawtooth',0.4),i*150)); },
};
sndBtn.onclick = () => { soundOn = !soundOn; localStorage.setItem('pong_sound', soundOn?'on':'off'); updateSndBtn(); };
updateSndBtn();
// AudioContext kullanıcı jesti ister: ilk etkileşimde aç
addEventListener('pointerdown', audio, {once:true});
addEventListener('keydown', audio, {once:true});

/* ================= ZORLUK MODU ================= */
const diffBtns = Array.from(document.querySelectorAll('button.diff'));
function updateDiffUI(){
  diffBtns.forEach(b => b.classList.toggle('active', b.dataset.diff === diff));
}
function setDiff(name){
  if (!DIFFS[name]) return;
  diff = name;
  localStorage.setItem('pong_diff', diff);
  updateDiffUI();
  // yerel yedek beceriyi de moda göre başlat
  localSkill = {easy:10, normal:35, hard:60, very_hard:85}[name];
  // beyin anında yeni moda geçsin
  askBrain(16.7);
}
diffBtns.forEach(b => b.onclick = () => setDiff(b.dataset.diff));
updateDiffUI();

/* ================= BEYİN (Python sunucu /brain) ================= */
let brainUp = false;
let brainSkill = 0;
let weakZones = [];
const brainDot = document.getElementById('brainDot');
const brainTxt = document.getElementById('brainTxt');
function setBrainUI(up, skill, weak){
  brainUp = up;
  if (skill !== undefined) brainSkill = skill;
  if (weak) weakZones = weak;
  brainDot.className = 'dot ' + (up ? 'on' : 'off');
  brainTxt.textContent = up ? 'beyin çevrimiçi' : 'beyin çevrimdışı (yerel yedek)';
  document.getElementById('skillFill').style.width = brainSkill + '%';
  document.getElementById('skillBox').textContent = brainSkill;
  document.getElementById('zoneBox').textContent = weakZones.length + ' / ' + ZONES;
}
let brainPending = false;
async function askBrain(dtMs){
  if (brainPending || state === 'ready' || state === 'gameover') return;
  brainPending = true;
  const payload = {
    bx: ball.x, by: ball.y, vx: ball.vx, vy: ball.vy, speed: ball.speed,
    px: player.y + player.h/2, ay: ai.y, phase: state,
    score_p: scoreP, score_a: scoreA,
    missed_player: missedFlag, dtMs: dtMs,
    diff: diff,
  };
  missedFlag = false;
  try {
    const r = await fetch('/brain', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify(payload),
    });
    const j = await r.json();
    if (typeof j.aiY === 'number' && !j.error) {
      aiTarget = j.aiY;
      setBrainUI(true, j.skill, j.weak || []);
    } else setBrainUI(false, brainSkill, weakZones);
  } catch(e) {
    setBrainUI(false, brainSkill, weakZones);
  } finally { brainPending = false; }
}
const localBase = {easy:10, normal:35, hard:60, very_hard:85};
async function clearMemory(){
  try { await fetch('/clear_memory'); } catch(e){}
  localSkill = localBase[diff] || 35;
  setBrainUI(brainUp, brainSkill, []);
}
document.getElementById('memBtn').onclick = clearMemory;

/* Yerel yedek AI (beyin yanıt vermezse) */
let aiTarget = null;
let localSkill = localBase[diff] || 35;
function localBrain(dtMs){
  const s = clamp(localSkill,0,100)/100;
  const speed = 5.5 + 5.5*s, engage = 150 + 330*s;
  const step = speed * (dtMs/16.667);
  let target = H/2;
  if (state === 'playing' && ball.vx > 0) {
    const dist = (ai.x - BALL_R) - ball.x;
    if (dist < engage) {
      let x=ball.x, y=ball.y, vx=ball.vx, vy=ball.vy;
      for (let i=0;i<500 && x<ai.x-BALL_R;i++){ x+=vx; y+=vy; if(y<BALL_R||y>H-BALL_R) vy=-vy; }
      target = lerp(ball.y, y, s);
    } else target = H/2 + (ball.y - H/2)*0.3;
  }
  const d = target - (ai.y + ai.h/2);
  if (Math.abs(d) > 3) ai.y = clamp(ai.y + clamp(d, -step, step), 0, H-ai.h);
}

/* ================= Oyun akışı ================= */
function reset(){
  scoreP = 0; scoreA = 0; winner = '';
  player.y = H/2 - player.h/2; ai.y = H/2 - ai.h/2;
  ball.x = W/2; ball.y = H/2; ball.vx = 0; ball.vy = 0; ball.speed = BALL_SPEED0;
  state = 'ready';
}
function serve(dir){
  ball.x = W/2; ball.y = H/2; ball.speed = BALL_SPEED0;
  ball.prevX = ball.x;
  const a = (Math.random()*0.6 - 0.3) * Math.PI;
  ball.vx = Math.cos(a) * ball.speed * dir;
  ball.vy = Math.sin(a) * ball.speed;
  state = 'playing';
  S.serve();
}
function startOrServe(){
  if (state === 'gameover') { reset(); return; }
  if (state === 'ready' || state === 'point') serve(serveDir);
}
function afterPoint(dir){
  if (scoreP >= WIN_SCORE || scoreA >= WIN_SCORE) {
    state = 'gameover';
    winner = scoreP >= WIN_SCORE ? 'SEN' : 'BİLGİSAYAR';
    if (scoreP >= WIN_SCORE) S.win(); else S.lose();
    return;
  }
  serveDir = dir;
  state = 'point';
  pauseUntil = performance.now() + 900;
}
function hitPaddle(p, out){
  const rel = clamp((ball.y - (p.y + p.h/2)) / (p.h/2), -1, 1);
  const angle = rel * (Math.PI * 0.35);
  ball.speed = Math.min(ball.speed + BALL_ACC, BALL_MAX);
  ball.vx = Math.cos(angle) * ball.speed * out;
  ball.vy = Math.sin(angle) * ball.speed;
  ball.x = out > 0 ? p.x + p.w + BALL_R + 1 : p.x - BALL_R - 1;
  if (p === player) S.hitPlayer(); else S.hitAi();
}

/* ================= Girdi ================= */
const keys = {};
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  keys[k] = true;
  if (e.code === 'Space') { e.preventDefault(); startOrServe(); }
  if (k === 'r') reset();
  if (k === 'l') clearMemory();
  if (k === '1') setDiff('easy');
  if (k === '2') setDiff('normal');
  if (k === '3') setDiff('hard');
  if (k === '4') setDiff('very_hard');
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
canvas.addEventListener('mousemove', e => {
  const r = canvas.getBoundingClientRect();
  player.y = clamp((e.clientY - r.top) * (H / r.height) - player.h/2, 0, H - player.h);
});
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  const r = canvas.getBoundingClientRect();
  player.y = clamp((e.touches[0].clientY - r.top) * (H / r.height) - player.h/2, 0, H - player.h);
}, {passive:false});

/* ================= Döngü ================= */
let lastT = performance.now();
function update(now){
  const dtMs = Math.min(50, now - lastT); lastT = now;
  const dtF = dtMs / 16.667;

  if (state === 'point') { if (now >= pauseUntil) serve(serveDir); return; }
  if (state !== 'playing') return;

  const ps = PAD_SPEED * dtF;
  if (keys['arrowup'] || keys['w']) player.y -= ps;
  if (keys['arrowdown'] || keys['s']) player.y += ps;
  player.y = clamp(player.y, 0, H - player.h);

  // Beyin her kare sorulur (güncel durum). Yanıt gelmezse / çevrimdışıysa yerel AI.
  askBrain(dtMs);
  if (!brainUp) localBrain(dtMs);
  if (brainUp && aiTarget !== null) {
    ai.y = clamp(lerp(ai.y, clamp(aiTarget, 0, H - ai.h), 0.55), 0, H - ai.h);
    aiTarget = null;
  }

  ball.prevX = ball.x;
  ball.x += ball.vx * dtF;
  ball.y += ball.vy * dtF;
  if (ball.y - BALL_R < 0) { ball.y = BALL_R; ball.vy = Math.abs(ball.vy); S.wall(); }
  if (ball.y + BALL_R > H) { ball.y = H - BALL_R; ball.vy = -Math.abs(ball.vy); S.wall(); }

  if (ball.vx < 0) {
    const face = player.x + player.w;
    if (ball.prevX - BALL_R >= face && ball.x - BALL_R <= face &&
        ball.y > player.y - BALL_R && ball.y < player.y + player.h + BALL_R) {
      hitPaddle(player, 1);
    }
  }
  if (ball.vx > 0) {
    const face = ai.x;
    if (ball.prevX + BALL_R <= face && ball.x + BALL_R >= face &&
        ball.y > ai.y - BALL_R && ball.y < ai.y + ai.h + BALL_R) {
      hitPaddle(ai, -1);
    }
  }

  if (ball.x < -20) {
    scoreA++; missedFlag = true; S.lost();
    localSkill = clamp(localSkill + 12, 0, 100);
    afterPoint(1);
  } else if (ball.x > W + 20) {
    scoreP++; S.score();
    localSkill = clamp(localSkill - 5, 0, 100);
    afterPoint(-1);
  }
}

function drawPaddle(p, color){
  ctx.save(); ctx.shadowColor = color; ctx.shadowBlur = 16;
  ctx.fillStyle = color; ctx.fillRect(p.x, p.y, p.w, p.h); ctx.restore();
}
function overlay(title, sub){
  ctx.fillStyle = 'rgba(5,5,12,0.55)'; ctx.fillRect(0,0,W,H);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#fff'; ctx.font = 'bold 46px "Courier New", monospace';
  ctx.fillText(title, W/2, H/2 - 10);
  if (sub){ ctx.font = '20px "Courier New", monospace'; ctx.fillStyle = '#9fd'; ctx.fillText(sub, W/2, H/2 + 30); }
}
function render(){
  ctx.clearRect(0,0,W,H);
  ctx.setLineDash([12,14]); ctx.strokeStyle = 'rgba(120,150,200,0.25)'; ctx.lineWidth = 3;
  ctx.beginPath();
  for (let y=0; y<=H; y+=26){ ctx.moveTo(W/2,y); ctx.lineTo(W/2,y+13); }
  ctx.stroke(); ctx.setLineDash([]);

  ctx.globalAlpha = 0.12; ctx.fillStyle = '#ff5d7d';
  weakZones.forEach(z => ctx.fillRect(0, z*ZH, 8, ZH));
  ctx.globalAlpha = 1;

  drawPaddle(player, '#4fe3ff');
  drawPaddle(ai, '#ff5d7d');

  if (state !== 'ready') {
    ctx.save(); ctx.shadowColor = '#fff'; ctx.shadowBlur = 18; ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI*2); ctx.fill(); ctx.restore();
  }

  ctx.font = 'bold 44px "Courier New", monospace'; ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(140,160,190,0.5)';
  ctx.fillText(String(scoreP), W/2 - 80, 60);
  ctx.fillText(String(scoreA), W/2 + 80, 60);

  if (state === 'ready') overlay('HAZIR', 'SPACE ile başla');
  else if (state === 'point') overlay('...', '');
  else if (state === 'gameover') overlay(winner + ' KAZANDI', 'Yeniden: SPACE / R');
}
function loop(now){
  update(now);
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
