<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BEAT THE AI</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; background:#0a0a12; color:#fff;
    font-family:'Courier New',monospace; overflow:hidden; }
  body{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; }
  h1{ font-size:26px; letter-spacing:8px; color:#ff5a2a;
    text-shadow:0 0 10px rgba(255,90,20,.7), 0 0 3px #fff; }
  canvas{ background:#05050c; border:2px solid #1e2a44; border-radius:8px;
    box-shadow:0 0 40px rgba(0,255,255,.15) inset, 0 0 25px rgba(0,0,0,.6);
    display:block; touch-action:none; max-width:96vw; }
  .hint{ font-size:13px; color:#5a6b8c; letter-spacing:1px; text-align:center; line-height:1.7; }
  .hint b{ color:#9fd; }
  .stat{ font-size:12px; color:#6b7f9e; display:flex; gap:16px; align-items:center; flex-wrap:wrap; justify-content:center; }
  .stat b{ color:#4fe3ff; }
  .skillbar{ display:inline-block; width:110px; height:8px; background:#1a2338;
    border-radius:4px; vertical-align:middle; overflow:hidden; }
  .skillbar i{ display:block; height:100%; width:0%; background:linear-gradient(90deg,#4fe3ff,#ff5d7d); transition:width .3s; }
  .dot{ display:inline-block; width:8px; height:8px; border-radius:50%; vertical-align:middle; margin-right:4px; }
  .dot.on{ background:#5dffb0; box-shadow:0 0 6px #5dffb0; }
  .dot.off{ background:#ff5d7d; box-shadow:0 0 6px #ff5d7d; }
  button{ background:#1a2338; color:#9fd; border:1px solid #2a3a5a; border-radius:6px;
    font-family:inherit; font-size:12px; padding:4px 10px; cursor:pointer; letter-spacing:1px; }
  button:hover{ background:#243350; }
  #exitBtn{ background:#2a0d10; color:#ff5d5d; border:1px solid #5a1a1a; font-weight:bold;
    letter-spacing:2px; text-shadow:0 0 8px rgba(255,60,40,.6); }
  #exitBtn:hover{ background:#3a1114; box-shadow:0 0 14px rgba(255,50,30,.35); }
  .term{ font-size:12px; color:#ff5a2a; letter-spacing:2px; font-weight:bold;
    text-shadow:0 0 10px #ff3a0a; opacity:0; transition:opacity .2s; }
  .term.on{ opacity:1; animation:termflick .5s infinite alternate; }
  @keyframes termflick{ from{ text-shadow:0 0 8px #ff3a0a; } to{ text-shadow:0 0 18px #ff7a0a, 0 0 4px #fff; } }
  .mappick{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; justify-content:center; }
  .mappick span{ font-size:12px; color:#5a6b8c; letter-spacing:1px; }
</style>
</head>
<body>
  <h1>BEAT THE AI</h1>
  <canvas id="game" width="800" height="500"></canvas>
  <div class="mappick">
    <span>HARİTA:</span>
    <button id="mapBtn0">1 · KLASİK</button>
    <button id="mapBtn1">2 · BOŞLUK</button>
    <button id="mapBtn2">3 · YER ALTI</button>
    <button id="mapBtn3">4 · SANAYİ</button>
  </div>
  <div class="hint">Hareket: <b>↑ ↓</b> veya <b>W S</b> (veya fare) · Başlat: <b>SPACE</b> · Yeniden: <b>R</b> · Harita: <b>1-4 / Q E</b> · Hafızayı sil: <b>L</b></div>
  <div class="stat">
    <span class="term" id="termBanner">⚠ JUDGMENT DAY ⚠</span>
    <span><span class="dot off" id="brainDot"></span><b id="brainTxt">beyin çevrimdışı</b></span>
    <span>Rakip becerisi: <span class="skillbar"><i id="skillFill"></i></span> <b id="skillBox">0</b>/100</span>
    <span>Zayıf bölge: <b id="zoneBox">0/10</b></span>
    <button id="sndBtn">SES: AÇIK</button>
    <button id="memBtn">HAFIZAYI SIFIRLA</button>
    <button id="exitBtn">EXIT</button>
  </div>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

const WIN_SCORE = 7;
const PAD_W = 12, PAD_H = 90, PAD_SPEED = 8;
const BALL_R = 8, BALL_SPEED0 = 6, BALL_ACC = 1.3, BALL_MAX = 17;
const PADDLE_ANGLE = Math.PI * 0.35;   // raket temas açısı (brain.py ile AYNI kalmalı!)
const ZONES = 10, ZH = H / ZONES;

/* ================= HARİTALAR ================= */
// Engel tipleri:
//  - statik: {x, y, r}
//  - orbit : {r, move:{type:'orbit', cx, cy, R, w, a0}}  -> dairesel yörünge (Boşluk: asteroid)
//  - osc   : {r, x, move:{type:'osc', x, y0, amp, w, ph}} -> dikey salınım (Sanayi: piston)
const MAPS = [
  { name: 'Klasik',   obstacles: [] },
  { name: 'Boşluk',   obstacles: [
      { r: 30, x: W/2 + 150, y: H/2, move: { type: 'orbit', cx: W/2, cy: H/2, R: 150, w: 0.018, a0: 0 } },
  ]},
  { name: 'Yer Altı', obstacles: [{ x: W / 2, y: H / 2, r: 56 }] },
  { name: 'Sanayi',   obstacles: [
      { r: 30, x: 250, y: H/2, move: { type: 'osc', x: 250, y0: H/2, amp: 140, w: 0.030, ph: 0 } },
      { r: 30, x: 550, y: H/2, move: { type: 'osc', x: 550, y0: H/2, amp: 140, w: 0.030, ph: Math.PI } },
  ]},
];
let mapIdx = 0;
let obA = [], obPh = [];   // hareketli engellerin fazı (orbit açısı / osc faz)
function syncObstaclePhase(){
  obA  = MAPS[mapIdx].obstacles.map(o => (o.move && o.move.type === 'orbit' ? o.move.a0 : 0));
  obPh = MAPS[mapIdx].obstacles.map(o => (o.move && o.move.type === 'osc'   ? o.move.ph : 0));
}
function updateObstacles(dtF){
  MAPS[mapIdx].obstacles.forEach((ob, i) => {
    const m = ob.move;
    if (!m) return;
    if (m.type === 'orbit') { obA[i] += m.w * dtF; ob.x = m.cx + m.R * Math.cos(obA[i]); ob.y = m.cy + m.R * Math.sin(obA[i]); }
    else { obPh[i] += m.w * dtF; ob.x = m.x; ob.y = m.y0 + m.amp * Math.sin(obPh[i]); }
  });
}

let state = 'ready';
let scoreP = 0, scoreA = 0;
let winner = '';
let pauseUntil = 0, serveDir = 1;
let missedFlag = false;

/* Zorluk KALDIRILDI — beyin kalıcı olarak "ÇOK ZOR"da çalışıyor. */
const diff = 'very_hard';
/* Top bu hızın üstüne çıkınca "JUDGMENT DAY" modu: alev + tema müziği */
const TERM_SPEED = 12;
let termMode = false;
const termBanner = document.getElementById('termBanner');

const player = { x:24, y:H/2-PAD_H/2, w:PAD_W, h:PAD_H };
const ai     = { x:W-24-PAD_W, y:H/2-PAD_H/2, w:PAD_W, h:PAD_H };
const ball = { x:W/2, y:H/2, vx:0, vy:0, speed:BALL_SPEED0, prevX:W/2 };

const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const lerp  = (a,b,t) => a + (b - a) * t;

/* ================= HARİTA SEÇİMİ ================= */
const mapBtns = [0,1,2,3].map(i => document.getElementById('mapBtn' + i));
function setMap(i){
  mapIdx = clamp(i, 0, MAPS.length - 1);
  syncObstaclePhase();
  localStorage.setItem('pong_map', String(mapIdx));
  mapBtns.forEach((b, j) => {
    b.style.background = (j === mapIdx) ? '#2a3a5a' : '';
    b.style.color      = (j === mapIdx) ? '#fff' : '';
    b.style.borderColor= (j === mapIdx) ? '#4fe3ff' : '';
  });
}
function cycleMap(d){ setMap((mapIdx + d + MAPS.length) % MAPS.length); }
mapBtns.forEach((b, i) => { b.onclick = () => setMap(i); });
setMap(parseInt(localStorage.getItem('pong_map') || '0', 10) || 0);

/* ================= SES (WebAudio sentez — dosya yok) ================= */
let AC = null, master = null;
let soundOn = localStorage.getItem('pong_sound') !== 'off';
const sndBtn = document.getElementById('sndBtn');
function updateSndBtn(){ sndBtn.textContent = 'SES: ' + (soundOn ? 'AÇIK' : 'KAPALI'); }
function audio(){
  if (!AC) {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = 0.5; master.connect(AC.destination);
  }
  if (AC.state === 'suspended') AC.resume();
  return AC;
}
function blip(freq, dur, type, vol, slideTo){
  if (!soundOn) return;
  try {
    const ac = audio();
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = freq;
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, ac.currentTime + dur);
    g.gain.setValueAtTime(vol, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur);
    o.connect(g); g.connect(master);
    o.start(); o.stop(ac.currentTime + dur + 0.02);
  } catch(e){}
}
const S = {
  hitPlayer: () => blip(520, 0.09, 'square', 0.5, 700),
  hitAi:     () => blip(300, 0.11, 'square', 0.45, 240),
  wall:      () => blip(200, 0.05, 'triangle', 0.3, 160),
  serve:     () => blip(360, 0.06, 'triangle', 0.25, 430),
  score:     () => { blip(520,0.10,'sawtooth',0.35,760); setTimeout(()=>blip(780,0.12,'sawtooth',0.3,1040),80); },
  lost:      () => { blip(300,0.16,'sawtooth',0.35,200); setTimeout(()=>blip(200,0.2,'sawtooth',0.3,120),110); },
  win:  () => { [523,659,784,1047].forEach((f,i)=>setTimeout(()=>blip(f,0.18,'square',0.4),i*110)); },
  lose: () => { [400,330,270,170].forEach((f,i)=>setTimeout(()=>blip(f,0.24,'sawtooth',0.4),i*150)); },
  // AI kahkahası (sentez): kısa kesik "ha-ha-ha" patlamaları + karanlık formlar
  laugh: () => {
    if (!soundOn) return;
    try {
      const ac = audio(), t0 = ac.currentTime;
      const bands = [
        { f: 300, q: 9,  g: 0.55 },   // "h" üflemesi
        { f: 560, q: 12, g: 0.30 },   // "a" formanı
        { f: 840, q: 14, g: 0.12 },
      ];
      const bursts = [0, 140, 280, 460, 640, 880];   // her "ha" ~140-260ms'de, sonu uzar
      bursts.forEach((off, bi) => {
        const dur = 0.11 + bi * 0.015, f0 = 210 + Math.random() * 40 - bi * 6;
        const o = ac.createOscillator(), g = ac.createGain();
        o.type = 'sawtooth'; o.frequency.setValueAtTime(f0, t0 + off/1000);
        o.frequency.exponentialRampToValueAtTime(f0 * 0.82, t0 + off/1000 + dur);
        g.gain.setValueAtTime(0.0001, t0 + off/1000);
        g.gain.exponentialRampToValueAtTime(0.5, t0 + off/1000 + 0.015);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + off/1000 + dur);
        o.connect(g);
        bands.forEach(b => {
          const bp = ac.createBiquadFilter();
          bp.type = 'bandpass'; bp.frequency.value = b.f; bp.Q.value = b.q;
          const bg = ac.createGain(); bg.gain.value = b.g;
          g.connect(bp); bp.connect(bg); bg.connect(master);
        });
        o.start(t0 + off/1000); o.stop(t0 + off/1000 + dur + 0.05);
      });
    } catch(e){}
  },
};
sndBtn.onclick = () => { soundOn = !soundOn; localStorage.setItem('pong_sound', soundOn?'on':'off'); updateSndBtn(); };
updateSndBtn();
// AudioContext kullanıcı jesti ister: ilk etkileşimde aç
addEventListener('pointerdown', audio, {once:true});
addEventListener('keydown', audio, {once:true});

/* ================= TERMINATOR 2 — TEMA MÜZİĞİ + ALEV ================= */
// Gerçek tema: /terminator_music.webm (Audio element, döngüde).
// Top TERM_SPEED'e ulaşınca çalınır, skor arası kesilir.
let termAudio = null;
function getTermAudio(){
  if (!termAudio) {
    termAudio = new Audio('/terminator_music.webm');
    termAudio.loop = true;
    termAudio.volume = 0.8;
  }
  return termAudio;
}
let termPlaying=false;
function termStart(){
  if (termPlaying) return;
  if (!soundOn) return;                 // SES KAPALI ise tema çalınmaz
  termPlaying = true;
  termBanner.classList.add('on');
  const ac = audio();           // AudioContext jestini de aç (başka efektler için)
  try {
    const a = getTermAudio();
    a.currentTime = 0;
    a.play().catch(()=>{});
  } catch(e){}
}
function termStop(){
  if (!termPlaying) return;
  termPlaying = false;
  termBanner.classList.remove('on');
  try {
    const a = getTermAudio();
    a.pause();
    a.currentTime = 0;
  } catch(e){}
}

/* ================= ALEV PARTİKÜLLERİ ================= */
let flames=[];
function spawnFlames(){
  for(let i=0;i<3;i++){
    flames.push({
      x: ai.x + Math.random()*ai.w,
      y: ai.y + Math.random()*ai.h,
      vx: (Math.random()-0.5)*0.4,
      vy: -0.6 - Math.random()*1.3,
      life: 0, max: 28+Math.random()*22,
      r: 3+Math.random()*6
    });
  }
}
function updateFlames(df){
  for(const f of flames){ f.x+=f.vx*df; f.y+=f.vy*df; f.life+=df; }
  flames=flames.filter(f=>f.life<f.max);
}
function drawFlames(){
  ctx.save(); ctx.globalCompositeOperation='lighter';
  for(const f of flames){
    const k=f.life/f.max, a=(1-k)*0.8, r=f.r*(1+(1-k)*1.5);
    const g=ctx.createRadialGradient(f.x,f.y,0,f.x,f.y,r);
    g.addColorStop(0,`rgba(255,240,150,${a})`);
    g.addColorStop(0.4,`rgba(255,120,20,${a*0.8})`);
    g.addColorStop(1,'rgba(255,0,0,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(f.x,f.y,r,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();
}
function drawAiFlame(){
  const t=performance.now()/100;
  const flick=0.7+0.3*Math.sin(t*3)*Math.sin(t*1.7);
  const g=ctx.createLinearGradient(0,ai.y,0,ai.y+ai.h);
  g.addColorStop(0,'#ffd24d'); g.addColorStop(0.3,'#ff7a00');
  g.addColorStop(0.7,'#ff3a0a'); g.addColorStop(1,'#7a1000');
  ctx.save();
  ctx.shadowColor='#ff5a00'; ctx.shadowBlur=34*flick;
  ctx.fillStyle=g; ctx.fillRect(ai.x,ai.y,ai.w,ai.h);
  ctx.fillStyle=`rgba(255,248,210,${0.55*flick})`;
  ctx.fillRect(ai.x+2,ai.y+4,ai.w-4,ai.h-8);
  ctx.restore();
}

/* ================= BEYİN (Python sunucu /brain) ================= */
let brainUp = false;
let brainSkill = 0;
let weakZones = [];
const brainDot = document.getElementById('brainDot');
const brainTxt = document.getElementById('brainTxt');
function setBrainUI(up, skill, weak){
  brainUp = up;
  if (skill !== undefined) brainSkill = skill;
  if (weak) weakZones = weak;
  brainDot.className = 'dot ' + (up ? 'on' : 'off');
  brainTxt.textContent = up ? 'beyin çevrimiçi' : 'beyin çevrimdışı (yerel yedek)';
  document.getElementById('skillFill').style.width = brainSkill + '%';
  document.getElementById('skillBox').textContent = brainSkill;
  document.getElementById('zoneBox').textContent = weakZones.length + ' / ' + ZONES;
}
let brainPending = false;
async function askBrain(dtMs){
  if (brainPending || state === 'ready' || state === 'gameover') return;
  brainPending = true;
  const payload = {
    bx: ball.x, by: ball.y, vx: ball.vx, vy: ball.vy, speed: ball.speed,
    px: player.y + player.h/2, ay: ai.y, phase: state,
    score_p: scoreP, score_a: scoreA,
    missed_player: missedFlag, dtMs: dtMs,
    diff: diff,
    term: termMode,
    // Harita engelleri: statik {x,y,r} veya hareketli + güncel faz (beyin simülasyona katar)
    obstacles: MAPS[mapIdx].obstacles.map((o,i) => {
      const b = {x:o.x, y:o.y, r:o.r};
      if (o.move && o.move.type === 'orbit') { b.move = {type:'orbit', ...o.move, a: obA[i]}; }
      if (o.move && o.move.type === 'osc')   { b.move = {type:'osc', ...o.move, ph: obPh[i]}; }
      return b;
    }),
  };
  missedFlag = false;
  try {
    const r = await fetch('/brain', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify(payload),
    });
    const j = await r.json();
    if (typeof j.aiY === 'number' && !j.error) {
      aiTarget = j.aiY;
      setBrainUI(true, j.skill, j.weak || []);
    } else setBrainUI(false, brainSkill, weakZones);
  } catch(e) {
    setBrainUI(false, brainSkill, weakZones);
  } finally { brainPending = false; }
}
const localBase = 95;   // yerel yedek beceri: kalıcı "çok zor"
async function clearMemory(){
  try { await fetch('/clear_memory'); } catch(e){}
  localSkill = localBase;
  setBrainUI(brainUp, brainSkill, []);
}
document.getElementById('memBtn').onclick = clearMemory;

/* EXIT: sunucuyu öldür (POST /shutdown) */
document.getElementById('exitBtn').onclick = () => {
  if (!confirm('Sunucu kapatılsın mı? (oyun ve beyin hafızası durur)')) return;
  fetch('/shutdown', { method: 'POST' }).catch(()=>{});
  document.body.style.transition = 'opacity .6s';
  setTimeout(() => { document.body.style.opacity = '0'; }, 60);
  setTimeout(() => { document.body.innerHTML =
    '<div style="color:#ff5a2a;font-family:monospace;font-size:20px;padding:40px;text-align:center">' +
    'KAPANIYOR...<br><small style="color:#7a5">sunucu durduruldu</small></div>'; }, 700);
};

/* Yerel yedek AI (beyin yanıt vermezse) */
let aiTarget = null;
let localSkill = localBase;
function localBrain(dtMs){
  const s = clamp(localSkill,0,100)/100;
  const speed = (termMode ? 20 : 7.5 + 3.5*s);   // alev modunda terminatör hızı
  const engage = 520;
  const step = speed * (dtMs/16.667);
  let target = H/2;
  if (state === 'playing' && ball.vx > 0) {
    const dist = (ai.x - BALL_R) - ball.x;
    if (dist < engage) {
      let x=ball.x, y=ball.y, vx=ball.vx, vy=ball.vy;
      // Harita engelleri: hareketlilerin fazı da adım adım ilerletilir (beyinle aynı)
      const src = MAPS[mapIdx].obstacles;
      const obs = src.map((o, i) => {
        const c = { x:o.x, y:o.y, r:o.r, _m:o.move || null };
        if (c._m && c._m.type === 'orbit') c._a = obA[i];
        if (c._m && c._m.type === 'osc')   c._p = obPh[i];
        return c;
      });
      for (let i=0;i<500 && x<ai.x-BALL_R;i++){
        x+=vx; y+=vy;
        if(y<BALL_R||y>H-BALL_R) vy=-vy;
        for (const c of obs) {
          const m=c._m;
          if (m){ if (m.type==='orbit'){ c._a+=m.w; c.x=m.cx+m.R*Math.cos(c._a); c.y=m.cy+m.R*Math.sin(c._a); }
                 else { c._p+=m.w; c.y=m.y0+m.amp*Math.sin(c._p); } }
          const dx=x-c.x, dy=y-c.y, rr=c.r+BALL_R, d2=dx*dx+dy*dy;
          if (d2<rr*rr){ const d=Math.sqrt(d2)||0.001, nx=dx/d, ny=dy/d;
            x=c.x+nx*rr; y=c.y+ny*rr;
            const dot=vx*nx+vy*ny; vx-=2*dot*nx; vy-=2*dot*ny; }
        }
      }
      // Alev modunda saf kesişim; normalde kısmen tahmin
      target = termMode ? y : lerp(ball.y, y, s);
    } else target = H/2 + (ball.y - H/2)*0.3;
  }
  const d = target - (ai.y + ai.h/2);
  if (Math.abs(d) > 3) ai.y = clamp(ai.y + clamp(d, -step, step), 0, H-ai.h);
}

/* ================= Oyun akışı ================= */
function reset(){
  scoreP = 0; scoreA = 0; winner = '';
  player.y = H/2 - player.h/2; ai.y = H/2 - ai.h/2;
  ball.x = W/2; ball.y = H/2; ball.vx = 0; ball.vy = 0; ball.speed = BALL_SPEED0;
  state = 'ready';
}
function serve(dir){
  // Güvenli başlangıç: harita engeli varsa topun doğduğu nokta engele gömülmesin
  ball.x = W/2; ball.y = H/2; ball.speed = BALL_SPEED0;
  for (const ob of MAPS[mapIdx].obstacles) {
    const rr = ob.r + BALL_R + 24;
    if (Math.hypot(ball.x - ob.x, ball.y - ob.y) < rr) {
      ball.x = ob.x;                 // engel ekseni üstünde kal
      ball.y = ob.y - rr;            // hemen üstüne kon
      if (ball.y < 30) ball.y = ob.y + rr;   // üst dar ise alta
    }
  }
  ball.prevX = ball.x;
  const a = (Math.random()*0.6 - 0.3) * Math.PI;
  ball.vx = Math.cos(a) * ball.speed * dir;
  ball.vy = Math.sin(a) * ball.speed;
  state = 'playing';
  if (termMode) { termMode = false; termStop(); }   // skor arası: alev + müzik kesilir
  S.serve();
}
function startOrServe(){
  if (state === 'gameover') { reset(); return; }
  if (state === 'ready' || state === 'point') serve(serveDir);
}
function afterPoint(dir){
  if (scoreP >= WIN_SCORE || scoreA >= WIN_SCORE) {
    state = 'gameover';
    winner = scoreP >= WIN_SCORE ? 'SEN' : 'BİLGİSAYAR';
    if (scoreP >= WIN_SCORE) S.win();
    else { S.lose(); S.laugh(); }          // AI kazanınca kahkaha
    return;
  }
  serveDir = dir;
  state = 'point';
  pauseUntil = performance.now() + 900;
}
function hitPaddle(p, out){
  const rel = clamp((ball.y - (p.y + p.h/2)) / (p.h/2), -1, 1);
  const angle = rel * PADDLE_ANGLE;
  ball.speed = Math.min(ball.speed + BALL_ACC, BALL_MAX);
  ball.vx = Math.cos(angle) * ball.speed * out;
  ball.vy = Math.sin(angle) * ball.speed;
  ball.x = out > 0 ? p.x + p.w + BALL_R + 1 : p.x - BALL_R - 1;
  if (p === player) S.hitPlayer(); else S.hitAi();
}

/* ================= Girdi ================= */
const keys = {};
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  keys[k] = true;
  if (e.code === 'Space') { e.preventDefault(); startOrServe(); }
  if (k === 'r') reset();
  if (k === 'l') clearMemory();
  if (k >= '1' && k <= '4') setMap(parseInt(k, 10) - 1);
  if (k === 'q') cycleMap(-1);
  if (k === 'e') cycleMap(1);
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
canvas.addEventListener('mousemove', e => {
  const r = canvas.getBoundingClientRect();
  player.y = clamp((e.clientY - r.top) * (H / r.height) - player.h/2, 0, H - player.h);
});
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  const r = canvas.getBoundingClientRect();
  player.y = clamp((e.touches[0].clientY - r.top) * (H / r.height) - player.h/2, 0, H - player.h);
}, {passive:false});

/* ================= Döngü ================= */
let lastT = performance.now();
function update(now){
  const dtMs = Math.min(50, now - lastT); lastT = now;
  const dtF = dtMs / 16.667;

  if (state === 'point') { if (now >= pauseUntil) serve(serveDir); return; }
  if (state !== 'playing') return;

  const ps = PAD_SPEED * dtF;
  if (keys['arrowup'] || keys['w']) player.y -= ps;
  if (keys['arrowdown'] || keys['s']) player.y += ps;
  player.y = clamp(player.y, 0, H - player.h);

  // Beyin her kare sorulur (güncel durum). Yanıt gelmezse / çevrimdışıysa yerel AI.
  askBrain(dtMs);
  if (!brainUp) localBrain(dtMs);
  if (brainUp && aiTarget !== null) {
    // Alev (JUDGMENT DAY) modunda neredeyse anlık takip; normalde yumuşak.
    const k = termMode ? 0.93 : 0.55;
    ai.y = clamp(lerp(ai.y, clamp(aiTarget, 0, H - ai.h), k), 0, H - ai.h);
    aiTarget = null;
  }

  // Top hızlanınca JUDGMENT DAY modu (alev + tema müziği)
  if (ball.speed >= TERM_SPEED && !termMode) { termMode = true; termStart(); }
  else if (ball.speed < TERM_SPEED - 2 && termMode) { termMode = false; termStop(); }
  if (termMode) { spawnFlames(); updateFlames(dtF); }

  ball.prevX = ball.x;
  ball.x += ball.vx * dtF;
  ball.y += ball.vy * dtF;
  if (ball.y - BALL_R < 0) { ball.y = BALL_R; ball.vy = Math.abs(ball.vy); S.wall(); }
  if (ball.y + BALL_R > H) { ball.y = H - BALL_R; ball.vy = -Math.abs(ball.vy); S.wall(); }

  // Harita engelleri (Yer Altı: orta metal daire) — top normal boyunca seker
  for (const ob of MAPS[mapIdx].obstacles) {
    const dx = ball.x - ob.x, dy = ball.y - ob.y;
    const rr = ob.r + BALL_R, d2 = dx*dx + dy*dy;
    if (d2 < rr*rr) {
      const d = Math.sqrt(d2) || 0.001, nx = dx/d, ny = dy/d;
      ball.x = ob.x + nx*rr; ball.y = ob.y + ny*rr;
      const dot = ball.vx*nx + ball.vy*ny;
      ball.vx -= 2*dot*nx; ball.vy -= 2*dot*ny;
      S.wall();
    }
  }

  if (ball.vx < 0) {
    const face = player.x + player.w;
    if (ball.prevX - BALL_R >= face && ball.x - BALL_R <= face &&
        ball.y > player.y - BALL_R && ball.y < player.y + player.h + BALL_R) {
      hitPaddle(player, 1);
    }
  }
  if (ball.vx > 0) {
    const face = ai.x;
    if (ball.prevX + BALL_R <= face && ball.x + BALL_R >= face &&
        ball.y > ai.y - BALL_R && ball.y < ai.y + ai.h + BALL_R) {
      hitPaddle(ai, -1);
    }
  }

  if (ball.x < -20) {
    scoreA++; missedFlag = true; S.lost();
    localSkill = clamp(localSkill + 12, 0, 100);
    afterPoint(1);
  } else if (ball.x > W + 20) {
    scoreP++; S.score();
    localSkill = clamp(localSkill - 5, 0, 100);
    afterPoint(-1);
  }
}

function drawPaddle(p, color){
  ctx.save(); ctx.shadowColor = color; ctx.shadowBlur = 16;
  ctx.fillStyle = color; ctx.fillRect(p.x, p.y, p.w, p.h); ctx.restore();
}
function overlay(title, sub){
  ctx.fillStyle = 'rgba(5,5,12,0.55)'; ctx.fillRect(0,0,W,H);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#fff'; ctx.font = 'bold 46px "Courier New", monospace';
  ctx.fillText(title, W/2, H/2 - 10);
  if (sub){ ctx.font = '20px "Courier New", monospace'; ctx.fillStyle = '#9fd'; ctx.fillText(sub, W/2, H/2 + 30); }
}
/* ================= HARİTA ARKA PLANLARI ================= */
// Boşluk: sabit yıldız alanı + gezegen
const stars = [];
(function(){ let s = 12345;
  const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 90; i++) stars.push({ x: rnd()*W, y: rnd()*H, r: 0.5 + rnd()*1.7, p: rnd()*Math.PI*2 });
})();
function drawSpace(now){
  const g = ctx.createRadialGradient(W*0.25, H*0.3, 60, W*0.25, H*0.3, 520);
  g.addColorStop(0, 'rgba(60,30,90,0.45)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  ctx.save(); ctx.globalAlpha = 0.3;
  const pg = ctx.createRadialGradient(W*0.8, H*0.78, 4, W*0.8, H*0.78, 46);
  pg.addColorStop(0, '#3a2a55'); pg.addColorStop(1, '#0c0618');
  ctx.fillStyle = pg; ctx.beginPath(); ctx.arc(W*0.8, H*0.78, 44, 0, Math.PI*2); ctx.fill();
  ctx.restore();
  for (const st of stars) {
    const tw = 0.35 + 0.65*Math.abs(Math.sin(now/700 + st.p));
    ctx.fillStyle = `rgba(200,220,255,${tw*0.8})`;
    ctx.fillRect(st.x, ((st.y + now*0.01*st.r) % (H+8)) - 4, st.r, st.r);
  }
}
function drawUnderground(now){
  for (const yy of [0, H-18]) {           // üst/alt boru + perçinler
    const g = ctx.createLinearGradient(0, yy, 0, yy+18);
    g.addColorStop(0, '#232b33'); g.addColorStop(1, '#0d1116');
    ctx.fillStyle = g; ctx.fillRect(0, yy, W, 18);
    ctx.strokeStyle = 'rgba(90,110,130,0.25)';
    for (let x = 20; x < W; x += 60){ ctx.beginPath(); ctx.arc(x, yy+9, 3, 0, Math.PI*2); ctx.stroke(); }
  }
  ctx.fillStyle = 'rgba(40,50,60,0.5)';   // yan raylar
  ctx.fillRect(0, 18, 6, H-36); ctx.fillRect(W-6, 18, 6, H-36);
  const g2 = ctx.createRadialGradient(W/2, H/2, 80, W/2, H/2, 320);
  g2.addColorStop(0, 'rgba(40,80,60,0.12)'); g2.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g2; ctx.fillRect(0,0,W,H);
}
function drawIndustry(now){
  const glow = 0.10 + 0.06*Math.sin(now/500);
  for (const bx of [12, W-22]) {         // yan parlayan çelik barlar
    const g = ctx.createLinearGradient(bx, 0, bx+10, 0);
    g.addColorStop(0, 'rgba(120,70,20,0)');
    g.addColorStop(0.5, `rgba(255,150,40,${glow})`);
    g.addColorStop(1, 'rgba(120,70,20,0)');
    ctx.fillStyle = g; ctx.fillRect(bx, 24, 10, H-48);
  }
  ctx.strokeStyle = 'rgba(120,80,30,0.18)';   // üst/alt ızgara
  for (let x = 40; x < W; x += 80) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 14); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x, H); ctx.lineTo(x, H-14); ctx.stroke();
  }
  const g = ctx.createRadialGradient(W/2, H*0.5, 100, W/2, H*0.5, 380);
  g.addColorStop(0, 'rgba(120,50,10,0.10)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
}
function drawObstacles(now){
  // Önce izler: orbit -> kesik yörünge halkası, osc -> dikey ray
  ctx.save();
  for (const ob of MAPS[mapIdx].obstacles){
    const m = ob.move;
    if (!m) continue;
    ctx.strokeStyle = 'rgba(150,170,200,0.14)';
    ctx.lineWidth = 2;
    if (m.type === 'orbit'){
      ctx.setLineDash([6, 8]);
      ctx.beginPath(); ctx.arc(m.cx, m.cy, m.R, 0, Math.PI*2); ctx.stroke();
    } else if (m.type === 'osc'){
      ctx.beginPath(); ctx.moveTo(m.x, m.y0 - m.amp); ctx.lineTo(m.x, m.y0 + m.amp); ctx.stroke();
    }
  }
  ctx.restore();
  for (const ob of MAPS[mapIdx].obstacles) {
    ctx.save();
    const isMove = !!ob.move;
    const g = ctx.createRadialGradient(ob.x-ob.r*0.3, ob.y-ob.r*0.3, 4, ob.x, ob.y, ob.r);
    g.addColorStop(0, '#4a5560'); g.addColorStop(0.7, '#232a31'); g.addColorStop(1, '#0e1114');
    ctx.shadowColor = isMove ? '#ff5d7d' : '#4fe3ff'; ctx.shadowBlur = 12;
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(ob.x, ob.y, ob.r, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = 'rgba(140,160,180,0.35)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(ob.x, ob.y, ob.r-4, 0, Math.PI*2); ctx.stroke();
    const spin = isMove ? now/900 : now/4000;
    for (let i = 0; i < 8; i++) {         // dönen perçinler (hareketli daha hızlı)
      const a = i/8*Math.PI*2 + spin;
      ctx.fillStyle = 'rgba(160,180,200,0.4)';
      ctx.beginPath(); ctx.arc(ob.x+Math.cos(a)*(ob.r-10), ob.y+Math.sin(a)*(ob.r-10), 2.4, 0, Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }
}
function drawMapBg(now){
  if (mapIdx === 1) drawSpace(now);
  else if (mapIdx === 2) drawUnderground(now);
  else if (mapIdx === 3) drawIndustry(now);
  drawTerminator(now);
  drawObstacles(now);
}
/* ============ T2 ARNOLD — PIXEL ART (20x22 ızgara) ============
   Referans: T2: Judgment Day — kelle, yoğun kaş kemeri, gömük göz çukurları,
   geniş burun, kalın çene, yanağında yanık/kesik izi (T800).
   Tonlar: '.' şeffaf  H kafa ıtırığı  S cilt  D gölge  B kaş  W çukur
           E göz (dinamik) N burun gölgesi  M ağız  C iz  N2 boyun
   Gözler E harfleriyle işaretleniyor, çizim sırasında termMode'a göre parlar. */
const TERM_ART = [
"......HHHHHHHH......",
"....HHSSSSSSSSHH....",
"...HSSSSSSSSSSSSH...",
"..HSSSSSSSSSSSSSSH..",
"..HSSSSSSSSSSSSSSH..",
"..HSSSSSSSSSSSSSSH..",
"..HBBBBBBBBBBBBBBH..",
"..HBBBBBBBBBBBBBBH..",
"..HSSWWSSWWWWSSSSH..",
"..HSWEEWWWWEEWSSSH..",
"..HSSWWWWWWWWWWSSH..",
"..HDDSSSNNNSSSSDDH..",
"..HDSNNSSSSNNSSSDH..",
"..HDDSSSSSSSSSSDDH..",
"..HDDSSMMSSMMSSDDH..",
"...HDDSSSSSSSSDDH...",
"....DDDSSSSSSDDH....",
"......NNNNNNNN......",
".....N2SSSSSSN2.....",
".....N2SSSSSSN2.....",
"....N2SSSSSSSSN2....",
"....N2NNNNNNNNN2....",
];
const TERM_TONE = { H:'#7d848f', S:'#5b636e', D:'#3a404a', B:'#14171c',
  W:'#07080b', N:'#454c57', M:'#1c2027', C:'#4a5560', N2:'#23272e' };
let termMouthOpen = 0;   // 0..1 — AI kazandığında ağız açılır (kahkaha animasyonu)
function drawTerminator(now){
  // Silik, karanlık, gözlü Terminator — arka plan (hafif belli)
  const flick = 0.5 + 0.5*Math.sin(now/900)*Math.sin(now/570);
  termMouthOpen += ((state === 'gameover' && winner === 'BİLGİSAYAR' ? 1 : 0) - termMouthOpen) * 0.08;
  const cx = W/2, top = 46, px = 9;    // px: piksel boyutu
  const cols = TERM_ART[0].length, rows = TERM_ART.length;
  const ox = cx - cols*px/2, oy = top;
  ctx.save();
  ctx.globalAlpha = 0.30 + 0.10*flick;  // "silik ama belli"
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const ch = TERM_ART[r][c];
      if (ch === '.' || ch === 'E') continue;
      // Göz bölgesi: E yerine dinamik parlama (termMode'a göre sıcak)
      let col = (ch === 'N2') ? TERM_TONE.N2 : TERM_TONE[ch] || TERM_TONE.S;
      // Hafif doku: her pikseli deterministik ama satıra göre karanlıklaştır
      const jit = ((r * 31 + c * 17) % 7) / 7 * 0.16;
      ctx.fillStyle = shade(col, -jit);
      ctx.fillRect(ox + c*px, oy + r*px, px - 1, px - 1);
      // Yanağın yanık izi (T800) — sağ yanağa ince koyu çizgi
      if (ch === 'S' && c >= 12 && c <= 13 && r >= 11 && r <= 15) {
        ctx.fillStyle = 'rgba(20,22,28,0.5)';
        ctx.fillRect(ox + c*px, oy + r*px, 2, px - 1);
      }
    }
  }
  // Gözler (E): termMode'da kızıl alev, yoksa soluk turuncu; AI kazanınca genişler
  const eyeCols = [[3,4],[9,10]];  // 2. göz E çiftleri (r=9)
  const eyeR = (termMode ? 4.6 : 3.2) + (termMouthOpen > 0.3 ? 1.2 : 0);
  const eyeY = oy + 9*px + px/2;
  ctx.shadowColor = termMode ? '#ff3a0a' : '#ff7a00';
  ctx.shadowBlur = termMode ? 26 : 12;
  ctx.fillStyle = termMode ? `rgba(255,64,16,${0.9+flick*0.1})` : `rgba(255,120,40,${0.55+flick*0.35})`;
  eyeCols.forEach(([a,b]) => {
    ctx.beginPath();
    ctx.ellipse(ox + (a+b+1)/2*px, eyeY, (b-a+1)*px*0.55*eyeR/3.2, eyeR*0.72, 0, 0, Math.PI*2);
    ctx.fill();
  });
  ctx.shadowBlur = 0;
  // Ağız: M harfleri normalde koyu çizgi; AI kazandığında açılır (kahkaha)
  if (termMouthOpen > 0.05) {
    const mo = termMouthOpen;
    ctx.fillStyle = `rgba(8,6,6,${0.75*mo})`;
    const mx = ox + 5*px, my = oy + 14*px - 2, mw = 8*px, mh = (3+7*mo)*px*0.55;
    ctx.beginPath();
    ctx.ellipse(mx + mw/2, my + mh/2, mw/2, mh/2, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = `rgba(255,70,30,${0.35*mo*flick})`;   // ağız içinden alev sızıntısı
    ctx.beginPath();
    ctx.ellipse(mx + mw/2, my + mh*0.72, mw*0.3, mh*0.26, 0, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.restore();
}
// hex rengi -0.16..+0.16 oranında karanlık/açıkla (doku için)
function shade(hex, k){
  const n = parseInt(hex.slice(1), 16);
  const f = v => Math.max(0, Math.min(255, Math.round(v * (1 - k))));
  return `rgb(${f(n>>16)},${f((n>>8)&255)},${f(n&255)})`;
}
function render(){
  ctx.clearRect(0,0,W,H);
  drawMapBg(performance.now());
  ctx.setLineDash([12,14]); ctx.strokeStyle = 'rgba(120,150,200,0.25)'; ctx.lineWidth = 3;
  ctx.beginPath();
  for (let y=0; y<=H; y+=26){ ctx.moveTo(W/2,y); ctx.lineTo(W/2,y+13); }
  ctx.stroke(); ctx.setLineDash([]);

  ctx.globalAlpha = 0.12; ctx.fillStyle = '#ff5d7d';
  weakZones.forEach(z => ctx.fillRect(0, z*ZH, 8, ZH));
  ctx.globalAlpha = 1;

  drawPaddle(player, '#4fe3ff');
  if (termMode) { drawAiFlame(); drawFlames(); }
  else drawPaddle(ai, '#ff5d7d');

  if (state !== 'ready') {
    ctx.save(); ctx.shadowColor = '#fff'; ctx.shadowBlur = 18; ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI*2); ctx.fill(); ctx.restore();
  }

  ctx.font = 'bold 44px "Courier New", monospace'; ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(140,160,190,0.5)';
  ctx.fillText(String(scoreP), W/2 - 80, 60);
  ctx.fillText(String(scoreA), W/2 + 80, 60);

  if (state === 'ready') overlay('HAZIR', 'SPACE ile başla');
  else if (state === 'point') overlay('...', '');
  else if (state === 'gameover') overlay(winner + ' KAZANDI', 'Yeniden: SPACE / R');
}
function loop(now){
  const dtMs = Math.min(50, now - (loop._last || now)); loop._last = now;
  updateObstacles(dtMs / 16.667);   // engel animasyonu her durumda
  update(now);
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
